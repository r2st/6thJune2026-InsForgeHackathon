name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after CI passes
        required: true
        default: false
        type: boolean
      apply_infra:
        description: Apply infra/insforge.toml before deploying functions
        required: true
        default: true
        type: boolean
      deploy_functions:
        description: Deploy InsForge edge functions
        required: true
        default: true
        type: boolean
      deploy_frontends:
        description: Deploy the demo and receipt Next.js apps to Vercel
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.0.0"
  NEXT_PUBLIC_INSFORGE_URL: ${{ vars.NEXT_PUBLIC_INSFORGE_URL || 'https://w369egnp.us-east.insforge.app' }}
  NEXT_PUBLIC_INSFORGE_ANON_KEY: ${{ secrets.INSFORGE_ANON_KEY || vars.NEXT_PUBLIC_INSFORGE_ANON_KEY || 'ci-anon-key' }}
  NEXT_PUBLIC_INGEST_URL: ${{ vars.NEXT_PUBLIC_INGEST_URL || 'https://w369egnp.us-east.insforge.app/functions/ingest' }}
  NEXT_PUBLIC_RECEIPT_URL: ${{ vars.NEXT_PUBLIC_RECEIPT_URL || 'http://localhost:3001' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      INSFORGE_ACCESS_TOKEN: ${{ secrets.INSFORGE_ACCESS_TOKEN }}
      INSFORGE_PROJECT_ID: ${{ secrets.INSFORGE_PROJECT_ID }}
      INSFORGE_URL: ${{ secrets.INSFORGE_URL || vars.NEXT_PUBLIC_INSFORGE_URL || 'https://w369egnp.us-east.insforge.app' }}
      INSFORGE_SERVICE_KEY: ${{ secrets.INSFORGE_SERVICE_KEY }}
      INSFORGE_BRANCH_PROJECT_ID: ${{ secrets.INSFORGE_BRANCH_PROJECT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
      DEVIN_TARGET_REPO: ${{ vars.DEVIN_TARGET_REPO || secrets.DEVIN_TARGET_REPO }}
      HUSH_GITHUB_TOKEN: ${{ secrets.HUSH_GITHUB_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_DEMO_PROJECT_ID: ${{ secrets.VERCEL_DEMO_PROJECT_ID }}
      VERCEL_RECEIPT_PROJECT_ID: ${{ secrets.VERCEL_RECEIPT_PROJECT_ID }}
      NEXT_PUBLIC_INSFORGE_URL: ${{ vars.NEXT_PUBLIC_INSFORGE_URL || secrets.INSFORGE_URL }}
      NEXT_PUBLIC_INSFORGE_ANON_KEY: ${{ secrets.INSFORGE_ANON_KEY || vars.NEXT_PUBLIC_INSFORGE_ANON_KEY }}
      NEXT_PUBLIC_INGEST_URL: ${{ vars.NEXT_PUBLIC_INGEST_URL }}
      NEXT_PUBLIC_RECEIPT_URL: ${{ vars.NEXT_PUBLIC_RECEIPT_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check deployment secrets
        run: |
          missing=0
          for name in \
            INSFORGE_ACCESS_TOKEN INSFORGE_PROJECT_ID INSFORGE_URL INSFORGE_SERVICE_KEY \
            INSFORGE_BRANCH_PROJECT_ID ANTHROPIC_API_KEY OPENROUTER_API_KEY \
            DEVIN_API_KEY DEVIN_TARGET_REPO HUSH_GITHUB_TOKEN VERCEL_TOKEN \
            VERCEL_ORG_ID VERCEL_DEMO_PROJECT_ID VERCEL_RECEIPT_PROJECT_ID \
            NEXT_PUBLIC_INSFORGE_URL NEXT_PUBLIC_INSFORGE_ANON_KEY \
            NEXT_PUBLIC_INGEST_URL NEXT_PUBLIC_RECEIPT_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment secret::$name is required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Apply InsForge config
        if: ${{ inputs.apply_infra }}
        run: npx @insforge/cli config apply --file infra/insforge.toml --auto-approve

      - name: Sync InsForge function secrets
        if: ${{ inputs.deploy_functions }}
        run: |
          set_secret() {
            key="$1"
            value="$2"
            if npx @insforge/cli secrets add "$key" "$value" >/tmp/insforge-secret.out 2>&1; then
              echo "$key staged"
            elif npx @insforge/cli secrets update "$key" --value "$value" >/tmp/insforge-secret.out 2>&1; then
              echo "$key updated"
            else
              cat /tmp/insforge-secret.out
              exit 1
            fi
          }

          set_secret INSFORGE_SERVICE_KEY "$INSFORGE_SERVICE_KEY"
          set_secret INSFORGE_BRANCH_PROJECT_ID "$INSFORGE_BRANCH_PROJECT_ID"
          set_secret ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          set_secret OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          set_secret DEVIN_API_KEY "$DEVIN_API_KEY"
          set_secret GITHUB_REPO "$DEVIN_TARGET_REPO"
          set_secret GITHUB_TOKEN "$HUSH_GITHUB_TOKEN"

      - name: Deploy InsForge edge functions
        if: ${{ inputs.deploy_functions }}
        run: pnpm --filter @hush/functions run deploy

      - name: Deploy receipt app to Vercel
        if: ${{ inputs.deploy_frontends }}
        working-directory: apps/receipt
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_RECEIPT_PROJECT_ID }}
        run: |
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" \
            --project "$VERCEL_PROJECT_ID" \
            --env NEXT_PUBLIC_INSFORGE_URL="$NEXT_PUBLIC_INSFORGE_URL" \
            --env NEXT_PUBLIC_INSFORGE_ANON_KEY="$NEXT_PUBLIC_INSFORGE_ANON_KEY" \
            --env NEXT_PUBLIC_INGEST_URL="$NEXT_PUBLIC_INGEST_URL" \
            --env NEXT_PUBLIC_RECEIPT_URL="$NEXT_PUBLIC_RECEIPT_URL" \
            --build-env NEXT_PUBLIC_INSFORGE_URL="$NEXT_PUBLIC_INSFORGE_URL" \
            --build-env NEXT_PUBLIC_INSFORGE_ANON_KEY="$NEXT_PUBLIC_INSFORGE_ANON_KEY" \
            --build-env NEXT_PUBLIC_INGEST_URL="$NEXT_PUBLIC_INGEST_URL" \
            --build-env NEXT_PUBLIC_RECEIPT_URL="$NEXT_PUBLIC_RECEIPT_URL"

      - name: Deploy demo app to Vercel
        if: ${{ inputs.deploy_frontends }}
        working-directory: apps/demo
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DEMO_PROJECT_ID }}
        run: |
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" \
            --project "$VERCEL_PROJECT_ID" \
            --env INSFORGE_URL="$INSFORGE_URL" \
            --env INSFORGE_SERVICE_KEY="$INSFORGE_SERVICE_KEY" \
            --env NEXT_PUBLIC_INSFORGE_URL="$NEXT_PUBLIC_INSFORGE_URL" \
            --env NEXT_PUBLIC_INSFORGE_ANON_KEY="$NEXT_PUBLIC_INSFORGE_ANON_KEY" \
            --env NEXT_PUBLIC_INGEST_URL="$NEXT_PUBLIC_INGEST_URL" \
            --env NEXT_PUBLIC_RECEIPT_URL="$NEXT_PUBLIC_RECEIPT_URL" \
            --env NEXT_PUBLIC_BUILD_SHA="$GITHUB_SHA" \
            --build-env NEXT_PUBLIC_INSFORGE_URL="$NEXT_PUBLIC_INSFORGE_URL" \
            --build-env NEXT_PUBLIC_INSFORGE_ANON_KEY="$NEXT_PUBLIC_INSFORGE_ANON_KEY" \
            --build-env NEXT_PUBLIC_INGEST_URL="$NEXT_PUBLIC_INGEST_URL" \
            --build-env NEXT_PUBLIC_RECEIPT_URL="$NEXT_PUBLIC_RECEIPT_URL" \
            --build-env NEXT_PUBLIC_BUILD_SHA="$GITHUB_SHA"
